[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cha-pipeline-auditor"
dynamic = ["version"]
description = "Static GitHub Actions security checks with reviewable findings"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/MIT-legacy.txt"]
requires-python = ">=3.13"
dependencies = ["PyYAML==6.0.3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
cha-auditor = "src.auditor:main"

[project.urls]
Repository = "https://github.com/nomatterwhathappns/CI-CD-Pipeline-Security-Auditor"
Documentation = "https://github.com/nomatterwhathappns/CI-CD-Pipeline-Security-Auditor/blob/main/README.md"
Issues = "https://github.com/nomatterwhathappns/CI-CD-Pipeline-Security-Auditor/issues"

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.setuptools.package-data]
src = ["data/*.json"]

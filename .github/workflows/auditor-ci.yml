name: Auditor CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Siapkan Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Pasang paket proyek
        run: python -m pip install -r requirements.txt

      - name: Jalankan pengujian
        run: python -m unittest discover -s tests -v

      - name: Audit workflow proyek
        run: |
          mkdir -p reports
                    python src/auditor.py .github/workflows --format json --fail-on-findings > reports/audit-report.json

      - name: Simpan laporan audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-audit-report
          path: reports/audit-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Simulasi tahap lanjutan
        run: |
          echo "SIMULASI: pemeriksaan lolos, tahap berikutnya boleh berjalan"

# Static audit fixture; this file is never executed by the tests.
name: Static auditor example; do not install as a workflow
'on': pull_request_target
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - run: npm ci
    - uses: actions/cache/save@v4
      with:
        path: .cache
        key: demo-shared-cache
cache-mode: write

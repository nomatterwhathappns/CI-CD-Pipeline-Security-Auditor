# Static audit fixture; this file is never executed by the tests.
name: Static auditor example; do not install as a workflow
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4.1.3
      with:
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}
        path: .
    - run: python3 ./artifact.py

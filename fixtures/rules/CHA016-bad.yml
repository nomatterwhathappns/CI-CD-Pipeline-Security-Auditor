# Static audit fixture; this file is never executed by the tests.
name: Static auditor example; do not install as a workflow
'on': issues
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - env:
        TITLE: ${{ github.event.issue.title }}
      run: printf 'TITLE=%s\n' "$TITLE" >> "$GITHUB_ENV"
